services:
  fivem:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/lizenzfass78851/docker-fivem-fexemu:latest
    container_name: fivem
    security_opt:
      # If run FiveM Enhanced
      - seccomp:unconfined
      # If run FiveM ARM64 EMU for e.g. RPi4
      - systempaths=unconfined
      - apparmor=unconfined
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - "fivem:/config"
      # Enable a volume mount for txAdmin's data files
      # - "txdata:/txData"
    ports:
      - "30120:30120"
      - "30120:30120/udp"
      # Allow txAdmin's webserver port to be accessible
      # - "40120:40120"
    environment:
      LICENSE_KEY: "license-key-here"
      USE_ENHANCED: "false"

volumes:
  fivem:
#  txdata:
